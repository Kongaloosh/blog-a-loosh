# nginx server block for the GoToSocial instance. Install as
# /etc/nginx/conf.d/social.kongaloosh.com.conf, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d social.kongaloosh.com
# (certbot rewrites this block to add the 443 listener and cert paths.)

server {
    listen 80;
    server_name social.kongaloosh.com;

    # Must be >= media-local-max-size in GoToSocial's config.yaml (100MiB).
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming API uses websockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600;
    }
}
